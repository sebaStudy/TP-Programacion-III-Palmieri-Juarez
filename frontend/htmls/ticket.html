<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticket de compra · La guitarra de Coco</title>
    <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles/general.css">
    <link rel="stylesheet" href="../styles/ticket.css">

    <script src="../scrypts/temas.js" defer></script>
    <script src="../scrypts/cart-storage.js" defer></script>
    <script src="../scrypts/ticket.js" defer></script>
</head>
<body>
    <header class="cabecera">
        <a class="marca" href="/ticket">
            <img src="/assets/img/logo.svg" alt="Logo de La guitarra de Coco">
            <span>La guitarra de Coco</span>
        </a>
        <nav class="nav" aria-label="Principal">
            <button id="boton-tema" class="boton-mono-color">
                <img id="icono-tema" src="../assets/img/modo oscuro.png" alt="Icono de tema">
            </button>
            <a href="/admin/login" class="activo">
                <span id="administrador">Administrador</span>
                <span id="admin">Admin</span>
            </a>
        </nav>
    </header>

    <main class="pagina-ticket">
        <section id="datos-ticket" class="ticket" hidden>
            <header class="cabecera-ticket">
                <img src="/assets/img/logo.svg" alt="" class="logo-ticket">
                <div>
                    <p id="empresa-ticket" class="empresa-ticket"></p>
                    <h1>Ticket de compra</h1>
                </div>
            </header>
            <p>Cliente: <span id="cliente-ticket"></span></p>
            <p>Fecha: <span id="fecha-ticket"></span></p>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="productos-ticket"></tbody>
                    <tfoot>
                        <tr>
                            <th colspan="3">Total</th>
                            <td id="total-ticket"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <p class="gracias-ticket">¡Gracias por tu compra!</p>
        </section>
        <p id="estado-ticket" role="status"></p>
        <div id="acciones-ticket" class="acciones-ticket" hidden>
            <button id="boton-descargar-ticket" class="boton-ticket boton-principal" type="button"
                    title="Descargar el ticket como archivo PDF">
                Descargar PDF
            </button>
            <button id="boton-salir" class="boton-ticket boton-secundario-ticket" type="button">
                Salir
            </button>
        </div>
    </main>

    <footer class="pie">
        <p>La guitarra de Coco · TP Integrador de Programación III · UTN Avellaneda</p>
        <p>Alumnos: Rocío Juárez · Sebastián Palmieri</p>
    </footer>
</body>
</html>
